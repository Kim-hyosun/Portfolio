name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 동시 배포 1개로 제한 (이전 배포가 진행 중이면 큐에 대기).
concurrency:
  group: pages
  cancel-in-progress: false

# GitHub Pages OIDC 배포에 필요한 권한.
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
